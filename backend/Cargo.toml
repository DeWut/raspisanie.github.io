[package]
name = "smart-campus-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
url = "2"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
teloxide = { version = "0.13", default-features = false, features = ["rustls", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
