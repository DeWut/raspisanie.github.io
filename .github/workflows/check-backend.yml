name: Check backend

on:
  push:
    branches:
      - main
      - feature/smart-campus-step-1
    paths:
      - 'backend/**'
      - '.gitattributes'
      - '.github/workflows/check-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.gitattributes'
      - '.github/workflows/check-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the Rust API and Telegram bot build verified on the feature branch.
  cargo-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Verify SQLx migration files use LF line endings
        run: |
          if grep -rIl $'\r' migrations; then
            echo "SQLx migration files must use LF line endings."
            exit 1
          fi

      - name: Compile all targets
        run: cargo check --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked
