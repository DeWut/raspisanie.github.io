name: Update schedule

on:
  push:
    branches: [main]
    paths:
      - update_schedule.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Не запускаем два обновления расписания одновременно.
concurrency:
  group: update-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update schedule
        id: update
        continue-on-error: true
        run: python update_schedule.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Обновление расписания"
            git push
          else
            echo "Расписание не изменилось — коммит не требуется."
          fi

      - name: Report partial update
        if: steps.update.outcome == 'failure'
        run: |
          echo "Некоторые группы не обновились. Успешно полученные расписания сохранены в репозитории."
          exit 1
