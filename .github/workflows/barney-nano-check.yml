name: BARNEY-NANO code checks

on:
  push:
    branches:
      - feature/smart-campus-step-1
    paths:
      - "scripts/barney_nano/**"
      - "docs/barney-nano.md"
      - ".github/workflows/barney-nano-check.yml"
  workflow_dispatch:

jobs:
  python-and-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python -m compileall -q scripts/barney_nano
      - name: Run release manager unit tests
        run: python -m unittest discover -s scripts/barney_nano -p "test_*.py" -v
      - name: Validate training dependencies file
        run: test -s scripts/barney_nano/requirements.txt
      - name: Validate Windows launchers and guide
        run: |
          test -s scripts/barney_nano/BARNEY_NANO.bat
          test -s scripts/barney_nano/install.ps1
          test -s scripts/barney_nano/render_release.ps1
          test -s docs/barney-nano.md

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installers and release manager
        shell: pwsh
        run: |
          $files = @(
            "scripts/barney_nano/install.ps1",
            "scripts/barney_nano/render_release.ps1"
          )
          foreach ($file in $files) {
            $source = Get-Content $file -Raw
            [void][scriptblock]::Create($source)
            Write-Host "Parsed: $file"
          }
      - name: Verify BAT menu routes
        shell: pwsh
        run: |
          $launcher = Get-Content "scripts/barney_nano/BARNEY_NANO.bat" -Raw
          foreach ($required in @(
            "release_manager.py",
            "render_release.ps1",
            "[9] Readiness report",
            "[10] Review benchmark answers",
            "[11] Build versioned Ollama candidate",
            "[12] Promote candidate to live Render backend",
            "[13] Roll back to previous live model"
          )) {
            if ($launcher -notmatch [regex]::Escape($required)) {
              throw "BARNEY_NANO.bat is missing expected entry: $required"
            }
          }
