services:
  - type: web
    name: spbftuit-smart-campus
    runtime: docker
    branch: feature/smart-campus-step-1
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PORT
        value: "8080"
      - key: RUST_LOG
        value: info
      - key: WEBAPP_URL
        value: https://dewut.github.io/raspisanie.github.io/miniapp/
      - key: CORS_ALLOWED_ORIGINS
        value: https://dewut.github.io
      - key: DEV_BYPASS_AUTH
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: TELOXIDE_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
