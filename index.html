<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>Моё расписание · ИСИТ-26</title>
<style>
:root {
  /* Спокойная, современная палитра (Apple / Notion style) */
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #86868b;
  --line: #e5e5ea;
  --accent: #000000;
  --blue: #007aff;
  --green: #34c759;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
  --r: 24px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f5f5f7;
    --muted: #98989d;
    --line: #38383a;
    --accent: #ffffff;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}
button, input { font: inherit; }

.app { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }

/* Шапка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
.user-info { display: flex; align-items: center; gap: 16px; }
.avatar { font-size: 32px; background: var(--card); border-radius: 50%; width: 56px; height: 56px; display: grid; place-items: center; box-shadow: var(--shadow); }
h1 { font-size: 24px; margin: 0; font-weight: 700; letter-spacing: -0.5px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

/* Кнопки */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.primary:hover { opacity: 0.8; }

/* Bento сетка для главного экрана */
.bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.card { background: var(--card); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--line); }

.hero { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; min-height: 160px; }
.greeting { font-size: 32px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -1px; }
.greeting-sub { font-size: 16px; color: var(--muted); line-height: 1.5; }

.focus-card h3 { margin: 0 0 4px 0; font-size: 14px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.focus-subject { font-size: 20px; font-weight: 700; margin: 8px 0; }
.focus-meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }

/* Прогресс-бар без "иишного" неона */
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: auto; }
.progress i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width 1s linear; }

/* Тулбар */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 32px 0 20px; }
.search { flex: 1; min-width: 200px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 12px 16px; outline: 0; box-shadow: var(--shadow); }
.search:focus { border-color: var(--blue); }
.seg { display: flex; background: var(--line); padding: 4px; border-radius: 14px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 14px; transition: 0.2s; }
.seg button.active { background: var(--card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

/* Расписание */
.week { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.day { background: var(--card); border-radius: 20px; border: 1px solid var(--line); overflow: hidden; }
.day.today { border: 2px solid var(--blue); }
.dayhead { padding: 16px 20px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
.dayname { font-weight: 700; font-size: 16px; }
.daynum { color: var(--muted); font-size: 13px; }
.todaytag { background: var(--blue); color: #fff; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; margin-right: 8px; }

.lesson { padding: 16px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; position: relative; }
.lesson:last-child { border-bottom: none; }
.lesson:hover { background: rgba(0,0,0,0.02); }
.lesson.now::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--blue); }
.lesson.done { opacity: 0.6; }

.ltop { display: flex; justify-content: space-between; margin-bottom: 6px; }
.time { font-size: 13px; font-weight: 600; color: var(--muted); }
.status { font-size: 11px; font-weight: 700; text-transform: uppercase; }
.status.now { color: var(--blue); }
.subject { font-weight: 600; font-size: 15px; margin: 0 0 4px 0; line-height: 1.3; }
.meta { font-size: 13px; color: var(--muted); }
.empty { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); border-radius: 20px; border: 1px dashed var(--line); }

@media (max-width: 768px) {
  .bento-grid { grid-template-columns: 1fr; }
  .hero { grid-column: span 1; }
  .top { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="user-info">
      <div class="avatar">✌️</div>
      <div>
        <h1>ЛПб-ИСИТ-26-1</h1>
        <div class="sub">Моё расписание · Осенний семестр</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="goToday()">Сегодня</button>
      <button class="btn primary" onclick="loadSchedule(true)">Обновить</button>
    </div>
  </header>

  <section class="bento-grid">
    <div class="card hero">
      <h2 class="greeting" id="mainGreeting">Привет!</h2>
      <p class="greeting-sub" id="mainDesc">Загружаем данные...</p>
    </div>
    <div class="card focus-card">
      <h3 id="currentLabel">Сейчас</h3>
      <div class="focus-subject" id="currentSubject">—</div>
      <div class="focus-meta" id="currentMeta">—</div>
      <div class="progress"><i id="progress"></i></div>
    </div>
    <div class="card focus-card">
      <h3>Дальше</h3>
      <div class="focus-subject" id="nextSubject">—</div>
      <div class="focus-meta" id="nextMeta">—</div>
    </div>
  </section>

  <div class="toolbar">
    <div class="seg" id="weekSeg">
      <button data-mode="current" class="active">Эта неделя</button>
      <button data-mode="all">Всё расписание</button>
    </div>
    <input class="search" id="search" placeholder="Поиск предмета или препода...">
  </div>

  <section class="week" id="week"></section>
</div>

<script>
// Встроенное расписание оставлено без изменений для работоспособности
const fallbackSchedule = {
 "Понедельник": [
  {"time": "1 • 09:15–10:50", "subject": "Информатика Лек.", "teacher": "Васильев Н.П.", "room": "ауд. 1.231", "week": "нечёт"},
  {"time": "2 • 11:10–12:45", "subject": "История России Лек.", "teacher": "Мельников Н.Н.", "room": "ауд. 2а.455", "week": "*"},
  {"time": "3 • 13:30–15:05", "subject": "История России Пр.", "teacher": "Мельников Н.Н.", "room": "ауд. 2.415", "week": "*"},
  {"time": "4 • 15:15–16:50", "subject": "Начертательная геометрия и инженерная графика Пр.", "teacher": "Вохмянин Н.А., Куликова Д.Р.", "room": "ауд. 2.210", "week": "*"}
 ],
 "Вторник": [
  {"time": "1 • 09:15–10:50", "subject": "Управление личным временем Лек.", "teacher": "Подолянец Л.А.", "room": "ауд. 1.242", "week": "чёт"},
  {"time": "2 • 11:10–12:45", "subject": "Физическая культура и спорт Лек.", "teacher": "Тарасеня Т.Ю.", "room": "ауд. 2а.451", "week": "*"},
  {"time": "3 • 13:30–15:05", "subject": "Иностранный язык Пр.", "teacher": "Ломакина И.С.", "room": "ауд. 1.412", "week": "*"},
  {"time": "4 • 15:15–16:50", "subject": "Межкультурное взаимодействие в современном мире Пр.", "teacher": "Михайлова А.И.", "room": "ауд. 1.321", "week": "чёт"},
  {"time": "5 • 17:00–18:35", "subject": "Физика Лек.", "teacher": "Былев А.Б.", "room": "ауд. 1.010", "week": "чёт"}
 ],
 "Среда": [
  {"time": "1 • 09:15–10:50", "subject": "Межкультурное взаимодействие в современном мире Лек.", "teacher": "Михайлова А.И.", "room": "ауд. 1.318", "week": "чёт"},
  {"time": "2 • 11:10–12:45", "subject": "Математика Лек.", "teacher": "Одинцова Н.А.", "room": "ауд. 1.318", "week": "*"},
  {"time": "3 • 13:30–15:05", "subject": "Математика Пр.", "teacher": "Одинцова Н.А.", "room": "ауд. 1.337", "week": "*"},
  {"time": "4 • 15:15–16:50", "subject": "История России Пр.", "teacher": "Мельников Н.Н.", "room": "ауд. 2.419", "week": "*"},
  {"time": "5 • 17:00–18:35", "subject": "История России Пр.", "teacher": "Мельников Н.Н.", "room": "ауд. 2.419", "week": "чёт"}
 ],
 "Четверг": [
  {"time": "1 • 09:15–10:50", "subject": "Экспедиция обучения служением (Факультатив) 8ч Пр.", "teacher": "Шлапакова С.Н.", "room": "ауд. 1.026", "week": "чёт"},
  {"time": "2 • 11:10–12:45", "subject": "Ознакомительный практикум Пр.", "teacher": "Басова Е.Н.", "room": "ауд. 1.213", "week": "чёт"},
  {"time": "3 • 13:30–15:05", "subject": "Информатика Лаб.", "teacher": "Мартын К.А.", "room": "ауд. 1.310", "week": "*"},
  {"time": "4 • 15:15–16:50", "subject": "Физическая культура и спорт Пр.", "teacher": "Лешева Н.С.", "room": "ауд. Открытый стадион", "week": "*"}
 ],
 "Пятница": [
  {"time": "1 • 09:15–10:50", "subject": "Начертательная геометрия и инженерная графика Лек.", "teacher": "Вохмянин Н.А.", "room": "ауд. 2.409", "week": "чёт"},
  {"time": "1 • 09:15–10:50", "subject": "Основы российской государственности Лек.", "teacher": "Нуруллина Р.В.", "room": "ауд. 2.409", "week": "нечёт"},
  {"time": "2 • 11:10–12:45", "subject": "Основы российской государственности Пр.", "teacher": "Нуруллина Р.В.", "room": "ауд. 2.415", "week": "*"},
  {"time": "3 • 13:30–15:05", "subject": "Межкультурное взаимодействие в современном мире Пр.", "teacher": "Михайлова А.И.", "room": "ауд. 1.342", "week": "чёт"},
  {"time": "3 • 13:30–15:05", "subject": "Физика Лаб.", "teacher": "Совтус Н.В., Гаврилов С.П.", "room": "ауд. 1.025", "week": "нечёт"}
 ],
 "Суббота": [], "Воскресенье": []
};

let schedule = {...fallbackSchedule};
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
let selectedDate = new Date();
let weekMode = "current";

function loadSchedule(btn = false){
 if(btn) document.getElementById('mainGreeting').textContent = "Обновляю...";
 setTimeout(() => render(), 300); // Имитация загрузки
}

function semesterStart(){return new Date(2026,8,1)}
function weekNumber(d){
 let x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),s=semesterStart();
 x.setHours(0,0,0,0);s.setHours(0,0,0,0);
 return Math.floor(Math.floor((x-s)/86400000)/7)+1;
}
function parity(d){return weekNumber(d)%2===0?"чёт":"нечёт"}
function dayIdx(d){return (d.getDay()+6)%7}
function parseTime(x){
 const m=x.time.match(/(\d+)\s*•\s*(\d{1,2}):(\d{2})[–-](\d{1,2}):(\d{2})/);
 return m?{sh:+m[2],sm:+m[3],eh:+m[4],em:+m[5]}:null;
}
function dateTime(d,h,m){let x=new Date(d);x.setHours(h,m,0,0);return x}

function actualLessons(d){
 const dayName=DAYS[dayIdx(d)];
 if(!schedule[dayName]) return [];
 return schedule[dayName].filter(x=>x.week==="*"||x.week===parity(d)).map(x=>({...x, t:parseTime(x)}));
}

function matches(x,d){
 if(weekMode==="all") return true;
 return x.week==="*"||x.week===parity(d);
}

// Человекопонятное время (без дерганых секунд)
function humanTimeLeft(ms){
 if(ms<0) return "Меньше минуты";
 let m=Math.floor(ms/60000), h=Math.floor(m/60);
 m = m%60;
 if(h>0 && m>0) return `${h} ч ${m} мин`;
 if(h>0) return `${h} ч`;
 return `${m} мин`;
}

function statusFor(x,d,now){
 if(d.toDateString()!==now.toDateString()||!x.t) return "";
 const st=dateTime(d,x.t.sh,x.t.sm), en=dateTime(d,x.t.eh,x.t.em);
 if(now>=st&&now<en) return "now";
 if(now>=en) return "done";
 return "next";
}

function render(){
 const now=new Date();
 const todayLessons = actualLessons(now);
 const upcoming = todayLessons.filter(x=>x.t&&dateTime(now,x.t.sh,x.t.sm)>now);
 const current = todayLessons.find(x=>x.t&&now>=dateTime(now,x.t.sh,x.t.sm)&&now<dateTime(now,x.t.eh,x.t.em));
 
 // Человечный текст для Hero-блока
 const greetEl = document.getElementById("mainGreeting");
 const descEl = document.getElementById("mainDesc");
 
 const isWeekend = now.getDay() === 0 || now.getDay() === 6;
 
 if(isWeekend || todayLessons.length === 0){
    greetEl.textContent = "Сегодня пар нет 🛋️";
    descEl.textContent = `Отличный день, чтобы отдохнуть. Сейчас ${weekNumber(now)}-я неделя (${parity(now)}).`;
 } else {
    const end = todayLessons[todayLessons.length-1].time.split("–")[1];
    greetEl.textContent = `Сегодня ${todayLessons.length} пары 📚`;
    
    if(current) {
        descEl.textContent = `Пары закончатся в ${end}. Сейчас идет занятие.`;
    } else if(upcoming.length === 0) {
        descEl.textContent = "Все пары на сегодня закончились. Можно идти домой!";
    } else {
        const nextTime = upcoming[0].time.match(/(\d{1,2}:\d{2})/)[1];
        descEl.textContent = `Первая или следующая пара начнется в ${nextTime}. Учеба до ${end}.`;
    }
 }

 // Карточки "Сейчас" и "Дальше"
 const cs = document.getElementById("currentSubject"), cm = document.getElementById("currentMeta"), p = document.getElementById("progress");
 if(current && current.t){
    const st=dateTime(now,current.t.sh,current.t.sm), en=dateTime(now,current.t.eh,current.t.em);
    const pct=Math.max(0,Math.min(100,(now-st)/(en-st)*100));
    document.getElementById("currentLabel").textContent = `Осталось ${humanTimeLeft(en-now)}`;
    cs.textContent = current.subject;
    cm.textContent = `${current.room || ""} · ${current.teacher}`;
    p.style.width = pct+"%";
 } else {
    document.getElementById("currentLabel").textContent = "Сейчас";
    cs.textContent = "Свободное время";
    cm.textContent = "Можно выпить кофе ☕️";
    p.style.width = "0";
 }

 const ns = document.getElementById("nextSubject"), nm = document.getElementById("nextMeta");
 if(upcoming.length > 0) {
    const nxt = upcoming[0];
    ns.textContent = nxt.subject;
    nm.textContent = `Начнется в ${nxt.time.match(/(\d{1,2}:\d{2})/)[1]} · ${nxt.room || ""}`;
 } else {
    ns.textContent = "Больше пар нет";
    nm.textContent = "До завтра!";
 }

 renderWeek(now);
}

function renderWeek(now){
 const root=document.getElementById("week");
 const q=document.getElementById("search").value.toLowerCase().trim();
 
 root.innerHTML=DAYS.slice(0,5).map((day, di)=>{
  const d=new Date(now);
  d.setDate(d.getDate()-dayIdx(now)+di);
  const ist=d.toDateString()===now.toDateString();
  
  let arr = (schedule[day]||[]).filter(x=> matches(x,d) && (!q||`${x.subject} ${x.teacher} ${x.room}`.toLowerCase().includes(q)));
  
  return `<article class="day ${ist?"today":""}">
   <div class="dayhead">
     <div class="dayname">${ist?'<span class="todaytag">Сегодня</span>':""}${day}</div>
     <div class="daynum">${d.getDate()} число</div>
   </div>
   ${arr.length ? arr.map(x=>{
    const st = statusFor(x,d,now);
    return `<div class="lesson ${st}">
      <div class="ltop"><span class="time">${x.time.replace(/^\d\s*•\s*/, '')}</span>
      ${st==='now'?'<span class="status now">Идёт</span>':''}
      </div>
      <div class="subject">${x.subject}</div>
      <div class="meta">${x.teacher} ${x.room?" · "+x.room:""}</div>
    </div>`
   }).join("") : `<div class="empty">Пар нет</div>`}
  </article>`
 }).join("");
}

function goToday(){ selectedDate=new Date(); render(); }
document.querySelectorAll("#weekSeg button").forEach(b=>b.onclick=()=>{
 weekMode=b.dataset.mode;
 document.querySelectorAll("#weekSeg button").forEach(x=>x.classList.toggle("active",x===b));
 render();
});
document.getElementById("search").addEventListener("input",render);

// Обновление раз в минуту (людям не нужны секунды)
render();
setInterval(render, 60000);
</script>
</body>
</html>
