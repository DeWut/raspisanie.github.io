[package]
name = "smart-campus-wasm-nav"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
